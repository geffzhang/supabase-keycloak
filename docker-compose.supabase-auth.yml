# 叠加在官方自托管 docker-compose.yml 之上，只改 Supabase 的 auth 服务。
# 方案 A（GoTrue 换发 token）。
#
#   docker compose -f docker-compose.yml -f docker-compose.supabase-auth.yml up -d
#
# compose 的 environment 是键级深合并，主文件里的其它 GOTRUE_* 变量不会被清掉。
# 已验证：与主文件合并后 GOTRUE_JWT_SECRET 等原有变量均保留。
#
# ⚠️ 本文件只碰 auth。方案 B 的 rest/storage/realtime 覆盖在
#    docker-compose.supabase-thirdparty.yml 里，必须单独叠加——
#    否则在方案 A 下 PGRST_JWT_SECRET 会被写成空串，PostgREST 直接无法验签。

services:
  auth:
    environment:
      # ── 把 Keycloak 配成 GoTrue 的一个 OIDC provider ──
      GOTRUE_EXTERNAL_KEYCLOAK_ENABLED: "true"
      GOTRUE_EXTERNAL_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-supabase}
      GOTRUE_EXTERNAL_KEYCLOAK_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in .env}
      # GoTrue 会拼成 <API_EXTERNAL_URL>/callback
      GOTRUE_EXTERNAL_KEYCLOAK_REDIRECT_URI: ${API_EXTERNAL_URL:?set API_EXTERNAL_URL in .env}/callback
      # 必须是 issuer 形式 <host>/realms/<realm>，不能带 /auth 前缀（Keycloak 17+ 已去掉）
      GOTRUE_EXTERNAL_KEYCLOAK_URL: https://${KEYCLOAK_HOST:?set KEYCLOAK_HOST in .env}/realms/${KEYCLOAK_REALM:-supabase}
      # Keycloak 22+ 不传 openid 会在 authorize 阶段直接失败
      GOTRUE_EXTERNAL_KEYCLOAK_SCOPES: openid
      GOTRUE_SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      # 前端域名白名单，逗号分隔且**不带结尾斜杠**，否则 redirect_to 会被拒
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-}
