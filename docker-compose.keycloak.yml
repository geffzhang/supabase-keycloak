# Keycloak 服务 + 方案 B 的 JWKS 注入 + 安全加固。
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.supabase-thirdparty.yml \
#                  -f docker-compose.keycloak.yml up -d
#
# 直接用 scripts/start.sh 会自动带上正确的 -f 组合。
#
# 两个刻意的设计：
#   1. 这里**不用** ${VAR:?}。compose 的 :? 是解析阶段求值，只要本文件参与 -f，
#      连 `up -d keycloak` 都会被拦——而流程恰恰是「先起 Keycloak → 拿 JWKS →
#      再起 rest」。用了 :? 会死锁。非空校验放在 scripts/start.sh 里。
#   2. 不写容器内 healthcheck。Keycloak 26 基于 ubi-micro，镜像内没有
#      curl/wget/bash，任何依赖它们的探活都会永远 unhealthy。
#      就绪判断交给 scripts/wait-keycloak.sh 从宿主机探 :9000/health/ready。

services:
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start
      # 对外完整地址，决定 token 里的 iss。
      # 必须与浏览器地址栏、以及 verify.sh 用的地址三方逐字一致。
      # 本地默认 http://localhost:8081；生产改成 https://kc.example.com。
      - --hostname=${KC_SCHEME:-https}://${KEYCLOAK_HOST:-localhost:8081}
      # 反代后面必须开；否则 iss 会退化成容器内地址 http://keycloak:8080
      - --proxy-headers=xforwarded
      - --http-enabled=true
      - --http-port=8080
      - --health-enabled=true
      # 启动时导入 realm；已存在则跳过，不覆盖线上改过的配置
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      # 反代终止 TLS 时保持 false，否则 Host 头校验会与 health 探针打架
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      # 浏览器登录跳转必须能直达（宿主 8081 → 容器 8080）
      - "${KEYCLOAK_HTTP_PORT:-8081}:8080"
      # /health/ready 在管理口 9000，不在 8080。只绑 loopback，仅供本机探活。
      - "127.0.0.1:${KEYCLOAK_MGMT_PORT:-9000}:9000"

volumes:
  keycloak-db-data:
